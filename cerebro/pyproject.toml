[project]
name = "cerebro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.3",
    "fpdf2>=2.8.7",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.4",
    "langgraph>=1.2.2",
    "psycopg[binary]>=3.3.4",
    "pyjwt[crypto]>=2.9.0",
    "sqlalchemy>=2.0.50",
    "uvicorn[standard]>=0.48.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["testes"]
