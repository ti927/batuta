<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batuta — Página do Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;}
  body{font-family:'Inter',system-ui,sans-serif;color:#1A1730;background:#FAFAF7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;}
  #root{min-width:1024px;}

  .btn-primary{display:inline-flex;align-items:center;gap:8px;background:#6D4AFF;color:#fff;border:none;border-radius:6px;padding:0 16px;height:40px;font:500 14px/1 'Inter',sans-serif;cursor:pointer;transition:background .15s, transform .1s;white-space:nowrap;}
  .btn-primary:hover{background:#5A3FE0;}
  .btn-primary:active{transform:translateY(1px);}
  .btn-ghost{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#1A1730;border:1px solid #E8E6F0;border-radius:6px;padding:0 14px;height:40px;font:500 13.5px/1 'Inter',sans-serif;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap;}
  .btn-ghost:hover{background:#FAFAF7;border-color:#D6D3E8;}
  .btn-ghost:disabled,.btn-primary:disabled{opacity:.6;cursor:default;}

  .meta-chip{font-size:12px;color:#6B6880;background:#FAFAF7;border:1px solid #E8E6F0;padding:3px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;}
  .row-btn:hover{background:#FAFAF7!important;}
  .nav-item:hover{background:rgba(255,255,255,.07)!important;color:#fff!important;}
  .nav-sub:hover{background:rgba(255,255,255,.06)!important;color:#fff!important;}
  .org-switch:hover{border-color:rgba(255,255,255,.2)!important;}
  .link-roxo:hover{text-decoration:underline;}

  @keyframes spin{to{transform:rotate(360deg)}}
  .rise{animation:rise .42s cubic-bezier(.2,.7,.3,1);}
  @keyframes rise{from{transform:translateY(9px)}to{transform:none}}
  .drawer-in{animation:drawer .26s cubic-bezier(.2,.7,.3,1);}
  @keyframes drawer{from{transform:translateX(34px);opacity:0}to{transform:none;opacity:1}}
  .toast-in{animation:toast .3s ease;}
  @keyframes toast{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-thumb{background:#E0DDF0;border-radius:99px;border:3px solid transparent;background-clip:content-box;}
  ::-webkit-scrollbar-thumb:hover{background:#D0CCE6;background-clip:content-box;}
  ::-webkit-scrollbar-track{background:transparent;}
  input::placeholder,textarea::placeholder{color:#A09DB8;}
  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #6D4AFF;outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){.rise,.drawer-in,.toast-in{animation:none!important;}}
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#1A1730"/>
    <rect x="34" y="62" width="40" height="7" rx="3.5" transform="rotate(-43 34 62)" fill="#6D4AFF"/>
    <circle cx="66" cy="34" r="5" fill="#F5C44A"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app-icons.jsx"></script>

<script type="text/babel" src="app-data-team.jsx"></script>
<script type="text/babel" src="app-creation.jsx"></script>

</html>
